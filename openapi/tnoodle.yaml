openapi: 3.1.0
info:
    title: TNoodle backend
    description: Endpoints exposed by the backend server
    version: 1.0.0
servers:
    - url: 'http://localhost:2014'
paths:
    /version:
        get:
            summary: Show version information of the backend
            operationId: getVersionInfo
            responses:
                '200':
                    description: The version information object of the backend you're connected to
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/VersionInfo'
    /frontend/data/events:
        get:
            summary: Get a list of events that the backend can scramble
            operationId: getWcaEvents
            responses:
                '200':
                    description: A list of events
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/WcaEvent'
                                example:
                                    - id: "333"
                                      name: 3x3x3
                                      puzzle_id: "333"
                                      puzzle_group_id: nbyn
                                      format_ids: [ a, "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: "222"
                                      name: 2x2x2
                                      puzzle_id: "222"
                                      puzzle_group_id: nbyn
                                      format_ids: [ a, "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: "444"
                                      name: 4x4x4
                                      puzzle_id: "444"
                                      puzzle_group_id: nbyn
                                      format_ids: [ a, "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: "555"
                                      name: 5x5x5
                                      puzzle_id: "555"
                                      puzzle_group_id: nbyn
                                      format_ids: [ a, "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: "666"
                                      name: 6x6x6
                                      puzzle_id: "666"
                                      puzzle_group_id: nbyn
                                      format_ids: [ m, "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: "777"
                                      name: 7x7x7
                                      puzzle_id: "777"
                                      puzzle_group_id: nbyn
                                      format_ids: [ m, "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: 333bf
                                      name: 3x3x3 Blindfolded
                                      puzzle_id: "333"
                                      puzzle_group_id: nbyn
                                      format_ids: [ "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: 333fm
                                      name: 3x3x3 Fewest Moves
                                      puzzle_id: "333"
                                      puzzle_group_id: nbyn
                                      format_ids: [ m, "2", "1" ]
                                      can_change_time_limit: false
                                      is_timed_event: false
                                      is_fewest_moves: true
                                      is_multiple_blindfolded: false
                                    - id: 333oh
                                      name: 3x3x3 One-Handed
                                      puzzle_id: "333"
                                      puzzle_group_id: nbyn
                                      format_ids: [ a, "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: clock
                                      name: Clock
                                      puzzle_id: clock
                                      puzzle_group_id: null
                                      format_ids: [ a, "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: minx
                                      name: Megaminx
                                      puzzle_id: minx
                                      puzzle_group_id: null
                                      format_ids: [ a, "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: pyram
                                      name: Pyraminx
                                      puzzle_id: pyram
                                      puzzle_group_id: null
                                      format_ids: [ a, "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: skewb
                                      name: Skewb
                                      puzzle_id: skewb
                                      puzzle_group_id: null
                                      format_ids: [ a, "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: sq1
                                      name: Square-1
                                      puzzle_id: sq1
                                      puzzle_group_id: null
                                      format_ids: [ a, "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: 444bf
                                      name: 4x4x4 Blindfolded
                                      puzzle_id: "444"
                                      puzzle_group_id: nbyn
                                      format_ids: [ "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: 555bf
                                      name: 5x5x5 Blindfolded
                                      puzzle_id: "555"
                                      puzzle_group_id: null
                                      format_ids: [ "3", "2", "1" ]
                                      can_change_time_limit: true
                                      is_timed_event: true
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: false
                                    - id: 333mbf
                                      name: 3x3x3 Multiple Blindfolded
                                      puzzle_id: "333"
                                      puzzle_group_id: null
                                      format_ids: [ "3", "2", "1" ]
                                      can_change_time_limit: false
                                      is_timed_event: false
                                      is_fewest_moves: false
                                      is_multiple_blindfolded: true
    /frontend/data/formats:
        get:
            summary: Get a list of formats that the backend knows about
            operationId: getWcaFormats
            responses:
                '200':
                    description: A list of formats
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/WcaFormat'
                                example:
                                    - id: "1"
                                      name: "Best of 1"
                                      short_name: "Bo1"
                                    - id: "2"
                                      name: "Best of 2"
                                      short_name: "Bo2"
                                    - id: "3"
                                      name: "Best of 3"
                                      short_name: "Bo3"
                                    - id: a
                                      name: "Average of 5"
                                      short_name: "Ao5"
                                    - id: m
                                      name: "Mean of 3"
                                      short_name: "Mo3"
    /frontend/data/wcif-version:
        get:
            summary: Get the WCIF version that the backend supports
            operationId: getBackendWcifVersion
            responses:
                '200':
                    description: The WCIF version that the backend supports
                    content:
                        application/json:
                            schema:
                                type: string
                                example: 2.2.0
                                format: semver
    /frontend/puzzle/{puzzleId}/colors:
        get:
            summary: Get the default color scheme for a given puzzle
            operationId: getDefaultColorScheme
            parameters:
                - in: path
                  name: puzzleId
                  schema:
                      type: string
                  required: true
                  description: The ID of the puzzle
            responses:
                '200':
                    description: The default color scheme for the puzzle
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ColorScheme'
    /frontend/puzzle/{puzzleId}/scramble:
        get:
            summary: Get a random scramble for the given puzzle
            operationId: getRandomScramble
            parameters:
                - in: path
                  name: puzzleId
                  schema:
                      type: string
                  required: true
                  description: The ID of the puzzle
            responses:
                '200':
                    description: The random scramble for the puzzle
                    content:
                        application/json:
                            schema:
                                type: string
                                example: "R U R' U' R' F R2 U' R' U' R U R' F'"
    /frontend/puzzle/{puzzleId}/svg:
        post:
            summary: Paint a given scramble into SVG for a given color scheme
            operationId: paintScramble
            parameters:
                - in: path
                  name: puzzleId
                  schema:
                      type: string
                  required: true
                  description: The ID of the puzzle
                - in: query
                  name: scramble
                  schema:
                      type: string
                  description: Optional scramble to paint (otherwise paints solved puzzle)
            requestBody:
                description: The color scheme to paint
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ColorScheme'
            responses:
                '200':
                    description: The SVG of the puzzle
                    content:
                        image/svg+xml:
                            schema:
                                type: string
                                example: "<svg></svg>"
    /frontend/fmc/languages/available:
        get:
            summary: Get a list of languages for the FMC sheet that the backend supports
            operationId: getFmcSheetLanguages
            responses:
                '200':
                    description: A list of languages
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/FmcLanguage'
                                example:
                                    - code: da
                                      name: Danish
                                    - code: de
                                      name: German
                                    - code: en
                                      name: English
                                    - code: es
                                      name: Spanish
                                    - code: et
                                      name: Estonian
                                    - code: fi
                                      name: Finnish
                                    - code: fr
                                      name: French
                                    - code: hr
                                      name: Croatian
                                    - code: hu
                                      name: Hungarian
                                    - code: id
                                      name: Indonesian
                                    - code: it
                                      name: Italian
                                    - code: ja
                                      name: Japanese
                                    - code: ko
                                      name: Korean
                                    - code: pl
                                      name: Polish
                                    - code: pt
                                      name: Portuguese
                                    - code: pt-BR
                                      name: Brazilian Portuguese
                                    - code: ro
                                      name: Romanian
                                    - code: ru
                                      name: Russian
                                    - code: sl
                                      name: Slovenian
                                    - code: vi
                                      name: Vietnamese
                                    - code: zh-CN
                                      name: Chinese (Simplified)
                                    - code: zh-TW
                                      name: Chinese (Traditional)
    /frontend/fmc/languages/competitors:
        post:
            summary: Calculate a suggested list of FMC translations based on competitor nationalities
            operationId: calculateSuggestedFmcTranslations
            requestBody:
                description: A list of competitors in WCIF standard
                required: true
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/FmcCompetitor'
            responses:
                '200':
                    description: A list of suggested FMC translation locales
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: string
                                    description: The suggested FMC translation locale
                                    example: de
    /frontend/mbld/best:
        post:
            summary: Calculate the number of cubes you should generate for MBLD given a list of competitors and their PBs
            operationId: calculateMbldBest
            requestBody:
                description: A list of competitors in WCIF standard
                required: true
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/MbldCompetitor'
            responses:
                '200':
                    description: The best MBLD attempt
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MbldAttempt'
components:
    schemas:
        VersionInfo:
            type: object
            properties:
                project_name:
                    type: string
                    example: TNoodle-WCA
                project_version:
                    type: string
                    example: 1.2.3
                    format: semver
                is_signed_build:
                    type: boolean
                    example: true
                signature_key_bytes:
                    type: string
                    format: byte
                    example: dG5vb2RsZQ==
            required:
                - project_name
                - project_version
                - is_signed_build
                - signature_key_bytes

        WcaEvent:
            type: object
            properties:
                id:
                    type: string
                    example: "333"
                name:
                    type: string
                    example: 3x3x3
                puzzle_id:
                    type: string
                    example: "333"
                puzzle_group_id:
                    type: string
                    example: nbyn
                format_ids:
                    type: array
                    items:
                        type: string
                        example: ao5
                    example:
                        - a
                        - "3"
                        - "2"
                        - "1"
                can_change_time_limit:
                    type: boolean
                    example: true
                is_timed_event:
                    type: boolean
                    example: true
                is_fewest_moves:
                    type: boolean
                    example: false
                is_multiple_blindfolded:
                    type: boolean
                    example: false
            required:
                - id
                - name
                - puzzle_id
                - format_ids
                - can_change_time_limit
                - is_timed_event
                - is_fewest_moves
                - is_multiple_blindfolded

        WcaFormat:
            type: object
            properties:
                id:
                    type: string
                    example: ao5
                name:
                    type: string
                    example: Average of 5
                short_name:
                    type: string
                    example: Ao5
            required:
                - id
                - name
                - short_name

        ColorScheme:
            type: object
            additionalProperties:
                type: string
            example:
                U: "#FFFFFF"
                F: "#00FF00"
                R: "#FF0000"
                D: "#FFFF00"
                B: "#0000FF"
                L: "#FF8000"

        FmcLanguage:
            type: object
            properties:
                code:
                    type: string
                    example: jp
                    description: The ISO 639-1 code of the language
                name:
                    type: string
                    example: Japanese
                    description: The English display name of the language
            required:
                - code
                - name

        WcifRegistration:
            type: object
            properties:
                status:
                    type: string
                    description: The registration status of the competitor
            required:
                - status

        FmcCompetitor:
            type: object
            properties:
                registration:
                    $ref: '#/components/schemas/WcifRegistration'
                countryIso2:
                    type: string
                    description: The ISO 3166-1 alpha-2 code of the competitor's nationality
            required:
                - registration
                - countryIso2

        WcifPersonalBest:
            type: object
            properties:
                eventId:
                    type: string
                    description: The event ID
                value:
                    type: integer
                    description: The competitor's PB
            required:
                - eventId
                - value

        MbldCompetitor:
            type: object
            properties:
                registration:
                    $ref: '#/components/schemas/WcifRegistration'
                personalBests:
                    type: array
                    items:
                        $ref: '#/components/schemas/WcifPersonalBest'
            required:
                - registration
                - personalBests

        MbldAttempt:
            type: object
            properties:
                solved:
                    type: integer
                    description: The number of cubes which were solved
                    example: 60
                attempted:
                    type: integer
                    description: The number of cubes which were attempted
                    example: 60
                duration:
                    type: integer
                    description: The duration of the attempt in whole seconds
                    example: 3012
            required:
                - solved
                - attempted
                - duration
