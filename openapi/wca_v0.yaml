openapi: 3.1.0
info:
    title: TNoodle backend
    description: Endpoints exposed by the backend server
    version: 1.0.0
servers:
    - url: 'https://worldcubeassociation.org'
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
paths:
    /api/v0/me:
        get:
            summary: Show information about currently logged in user
            operationId: getMe
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: The user currently logged in through bearer token auth
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    me:
                                        type: object
                                        properties:
                                            name:
                                                type: string
                                                example: John Doe
                                        required:
                                            - name
                                required:
                                    - me
    /api/v0/scramble-program:
        get:
            summary: Show information about scramble program(s) permitted by the WCA
            operationId: getScrambleProgram
            responses:
                '200':
                    description: Information about scramble program(s) permitted by the WCA
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    current:
                                        type: object
                                        properties:
                                            name:
                                                type: string
                                            information:
                                                type: string
                                            download:
                                                type: string
                                                format: url
                                        required:
                                            - name
                                            - information
                                            - download
                                    allowed:
                                        type: array
                                        items:
                                            type: string
                                    publicKeyBytes:
                                        type: string
                                        format: byte
                                    history:
                                        type: array
                                        items:
                                            type: string
                                required:
                                    - current
                                    - allowed
                                    - publicKeyBytes
                                    - history
    /api/v0/competitions:
        get:
            summary: Get a list of competitions
            operationId: getCompetitions
            security:
                - bearerAuth:
                      - "manage_competitions"
            parameters:
                - in: query
                  name: managed_by_me
                  schema:
                      type: boolean
                  description: Limit to competitions managed by the authenticated user
                - in: query
                  name: start
                  schema:
                      type: string
                      format: date-time
                  description: Limit to competitions starting after this date
                - in: query
                  name: sort
                  schema:
                      type: string
                  description: Field to determine sorting order of result competitions
            responses:
                '200':
                    description: A list of competitions
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: object
                                    properties:
                                        id:
                                            type: string
                                        name:
                                            type: string
                                    required:
                                        - id
                                        - name
    /api/v0/competitions/{competitionId}/wcif/version/{formatVersion}:
        get:
            summary: Retrieve the WCIF of a specific competition in a specific format version
            operationId: getWcif
            security:
                - bearerAuth:
                      - "manage_competitions"
            parameters:
                - in: path
                  name: competitionId
                  schema:
                      type: string
                  required: true
                  description: The ID of the competition to fetch
                - in: path
                  name: formatVersion
                  schema:
                      type: string
                      format: semver
                  required: true
                  description: The format version of the resulting WCIF
            responses:
                '200':
                    description: The WCIF of the competition
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id:
                                        type: string
                                    formatVersion:
                                        type: string
                                    name:
                                        type: string
                                    shortName:
                                        type: string
                                    events:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                id:
                                                    type: string
                                                rounds:
                                                    type: array
                                                    items:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: string
                                                            format:
                                                                type: string
                                                            scrambleSetCount:
                                                                type: integer
                                                            timeLimit:
                                                                type: number
                                                            extensions:
                                                                type: array
                                                                items:
                                                                    type: object
                                                                    properties:
                                                                        id:
                                                                            type: string
                                                                        specUrl:
                                                                            type: string
                                                                            format: uri
                                                                        data:
                                                                            type: object
                                                                    required:
                                                                        - id
                                                                        - specUrl
                                                                        - data
                                                        required:
                                                            - id
                                                            - format
                                                            - scrambleSetCount
                                                            - extensions
                                                extensions:
                                                    type: array
                                                    items:
                                                        type: object
                                                        properties:
                                                            id:
                                                                type: string
                                                            specUrl:
                                                                type: string
                                                                format: uri
                                                            data:
                                                                type: object
                                                        required:
                                                            - id
                                                            - specUrl
                                                            - data
                                            required:
                                                - id
                                                - rounds
                                                - extensions
                                    persons:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                name:
                                                    type: string
                                                registration:
                                                    type: object
                                                    properties:
                                                        status:
                                                            type: string
                                                            enum:
                                                                - accepted
                                                                - pending
                                                                - rejected
                                                                - cancelled
                                                    required:
                                                        - status
                                                countryIso2:
                                                    type: string
                                                personalBests:
                                                    type: array
                                                    items:
                                                        type: object
                                                        properties:
                                                            eventId:
                                                                type: string
                                                            value:
                                                                type: integer
                                                        required:
                                                            - eventId
                                                            - value
                                            required:
                                                - name
                                                - registration
                                                - countryIso2
                                                - personalBests
                                    schedule:
                                        type: object
                                        properties:
                                            numberOfDays:
                                                type: integer
                                            venues:
                                                type: array
                                        required:
                                            - numberOfDays
                                            - venues
                                    extensions:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                id:
                                                    type: string
                                                specUrl:
                                                    type: string
                                                    format: uri
                                                data:
                                                    type: object
                                            required:
                                                - id
                                                - specUrl
                                                - data
                                required:
                                    - id
                                    - formatVersion
                                    - name
                                    - shortName
                                    - events
                                    - persons
                                    - schedule
                                    - extensions
